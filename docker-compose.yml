services:
  backend:
    build: ./business_logic
    ports:
      - "8000:8000"
    env_file:
      - ./business_logic/.env
    volumes:
      - ./business_logic:/app
      - ./database:/database
      - ./integration:/integration
    working_dir: /app

  frontend:
    build: ./presentation
    ports:
      - "5173:5173"
    volumes:
      - ./presentation:/app
    depends_on:
      - backend
